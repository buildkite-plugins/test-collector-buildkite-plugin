steps:
  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files: ["lib/**", "hooks/**"]

  - label: ":sparkles:"
    plugins:
      - plugin-linter#v4.1.0:
          id: test-collector

  - label: ":docker: :hammer:"
    plugins:
      - plugin-tester#v2.0.0: ~

  - label: "Security Scan"
    key: security_scan
    plugins:
      - secrets#v2.5.0:
          variables:
            GITHUB_TOKEN: GITHUB_TOKEN
      - ossf-scorecard#v1.1.0:
          github_token: $$GITHUB_TOKEN
